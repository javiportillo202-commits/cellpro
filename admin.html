<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin JaviCell</title>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"}}</script>
</head><body style="font-family:sans-serif;padding:1rem;max-width:500px;margin:auto">
<h2>Admin JaviCell</h2>
<input id="name" placeholder="Nombre" style="width:100%;padding:.6rem;margin:.3rem 0"><br>
<input id="price" type="number" placeholder="Precio Gs." style="width:100%;padding:.6rem;margin:.3rem 0"><br>
<input id="img" placeholder="URL imagen" style="width:100%;padding:.6rem;margin:.3rem 0"><br>
<button id="save" style="background:#111;color:#fff;padding:.8rem;width:100%;border:0;border-radius:8px">Guardar producto</button>
<h3>Productos</h3><div id="list"></div>
<script type="module">
import {initializeApp} from "firebase/app";
import {getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc} from "firebase/firestore";
const firebaseConfig = {apiKey:"AIzaSyDuCwgM1JD3KJlr8sKjVRGYgmU55nrwEeM",authDomain:"javicell-5aecd.firebaseapp.com",projectId:"javicell-5aecd",storageBucket:"javicell-5aecd.firebasestorage.app",messagingSenderId:"781066310901",appId:"1:781066310901:web:a7ffcae4644de5c53761bc"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
document.getElementById('save').onclick=async()=>{
  const name=document.getElementById('name').value, price=document.getElementById('price').value, img=document.getElementById('img').value;
  if(!name||!price) return alert('Falta nombre/precio');
  await addDoc(collection(db,"products"),{name,price:Number(price),img});
  document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';
};
onSnapshot(collection(db,"products"),(s)=>{
  const list=document.getElementById('list'); list.innerHTML='';
  s.forEach(d=>{const p=d.data(); list.innerHTML+=`<div style="border:1px solid #ddd;padding:.5rem;margin:.3rem 0">${p.name} - Gs.${p.price} <button data-id="${d.id}">Borrar</button></div>`});
  list.querySelectorAll('button').forEach(b=>b.onclick=async()=>await deleteDoc(doc(db,"products",b.dataset.id)));
});
</script></body></html>
