<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JaviCell</title>
<style>body{font-family:sans-serif;margin:0;background:#f5f5f5}header{background:#111;color:#fff;padding:1rem;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;padding:1rem}.card{background:#fff;border-radius:12px;padding:1rem;text-align:center}.card img{width:100%;height:140px;object-fit:contain}.btn{background:#25D366;color:#fff;border:0;padding:.7rem 1rem;border-radius:8px;width:100%;cursor:pointer}</style>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"}}</script>
</head>
<body>
<header><h1>JaviCell 📱</h1><p>Caaguazú - Paraguay</p></header>
<div id="grid" class="grid"></div>
<script type="module">
import {initializeApp} from "firebase/app";
import {getFirestore, collection, onSnapshot} from "firebase/firestore";
const firebaseConfig = {apiKey:"AIzaSyDuCwgM1JD3KJlr8sKjVRGYgmU55nrwEeM",authDomain:"javicell-5aecd.firebaseapp.com",projectId:"javicell-5aecd",storageBucket:"javicell-5aecd.firebasestorage.app",messagingSenderId:"781066310901",appId:"1:781066310901:web:a7ffcae4644de5c53761bc"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const grid = document.getElementById('grid');
onSnapshot(collection(db,"products"), (snap)=>{
  grid.innerHTML="";
  snap.forEach(d=>{
    const p=d.data();
    grid.innerHTML+=`<div class="card"><img src="${p.img||'https://via.placeholder.com/200'}"><h3>${p.name}</h3><p><b>Gs. ${Number(p.price).toLocaleString('es-PY')}</b></p><button class="btn" onclick="window.open('https://wa.me/595971XXXXXX?text=Hola JaviCell, quiero ${encodeURIComponent(p.name)}')">Pedir por WhatsApp</button></div>`;
  });
});
</script>
</body></html>
